[package]
name = "mindclaw"
version = "0.1.0"
description = "A Tauri App"
authors = ["you"]
edition = "2021"
default-run = "mindclaw"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "mindclaw_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[profile.dev]
incremental = true

[profile.release]
codegen-units = 1 # 允许 LLVM 执行更好的优化。
lto = true        # 启用链接时优化。
opt-level = "s"   # 优先考虑小的二进制文件大小。如果您更喜欢速度，请使用 `3`。
panic = "abort"   # 通过禁用 panic 处理程序来提高性能。
strip = true      # 确保移除调试符号。

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]

# ── Tauri Core ──────────────────────────────────────────────────────
# Desktop app framework + core plugins
tauri = { version = "2", features = ["tray-icon", "image-png"] }
tauri-plugin-opener = "2"
tauri-plugin-clipboard-manager = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-os = "2"
tauri-plugin-persisted-scope = "2"
tauri-plugin-process = "2"
tauri-plugin-stronghold = "2"

# ── Tauri Desktop-Only ──────────────────────────────────────────────
# Plugins not available on mobile (Android/iOS)
[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
tauri-plugin-autostart = "2"
tauri-plugin-cli = "2"
tauri-plugin-global-shortcut = "2"
tauri-plugin-updater = "2"
tauri-plugin-window-state = "2"

# ── Serialization ───────────────────────────────────────────────────
serde = { version = "1", features = ["derive"] } # struct derive + (de)serialize
serde_json = "1"                                 # JSON (de)serialize
serde_yaml = "0.9"                               # YAML frontmatter in markdown.rs
toml = "1.0"                                     # MCP config parsing

# ── Async Runtime ───────────────────────────────────────────────────
tokio = { version = "1", default-features = false, features = [
    "rt-multi-thread",
    "macros",
    "time",
    "io-util",
    "sync",
    "process",
    "fs",
    "io-std",
] }
tokio-util = "0.7" # CancellationToken for agent lifecycle

# ── Database ────────────────────────────────────────────────────────
rusqlite = { version = "0.39.0", features = [
    "bundled",
] } # SQLite for sessions + global DB

# ── HTTP Client ─────────────────────────────────────────────────────
http = "1.0"                                                                  # HeaderName / HeaderValue for MCP headers
reqwest = { version = "0.13", default-features = false, features = ["json"] }

# ── LLM Framework ───────────────────────────────────────────────────
rig-core = { version = "0.36.0", features = ["rmcp"] } # AI provider abstraction

# ── MCP Protocol ────────────────────────────────────────────────────
# Standalone MCP SDK for bridge management (independent of rig)
rmcp = { version = "1.6", features = [
    "client",
    "macros",
    "transport-child-process",
    "transport-streamable-http-client-reqwest",
    "transport-streamable-http-server",
] }

# ── ACP Protocol ────────────────────────────────────────────────────
agent-client-protocol = "0.14.0"

# ── CLI ─────────────────────────────────────────────────────────────
clap = { version = "4", features = [
    "derive",
] } # CLI argument parsing (bin/cli.rs)

# ── Agent Tools: Search & File Discovery ────────────────────────────
grep-regex = "0.1"    # Regex-based content search
grep-searcher = "0.1" # Searcher engine for file content scanning
ignore = "0.4"        # File tree walking (.gitignore aware)
globset = "0.4"       # Glob pattern matching for file filters

# ── Concurrency ─────────────────────────────────────────────────────
dashmap = "6.0" # Concurrent HashMap for agent state
futures-util = { version = "0.3", default-features = false, features = [
    "std",
    "async-await",
] } # StreamExt + stream::iter for async streams
async-trait = "0.1" # #[async_trait] macro

# ── Channels: Feishu long-connection + protobuf framing ─────────────
tokio-tungstenite = { version = "0.23", default-features = false, features = [
    "connect",
    "rustls-tls-webpki-roots",
    "handshake",
] } # Feishu/Lark WSS 长连接
prost = "0.12"  # pbbp2.proto frame codec for Feishu WS
base64 = "0.22" # image/attachment markers

# ── Configuration & Paths ───────────────────────────────────────────
directories = "6.0" # OS-standard config/cache paths

# ── Time ────────────────────────────────────────────────────────────
chrono = { version = "0.4", default-features = false, features = [
    "clock",
    "std",
    "serde",
] } # timestamps, session pruning

# ── Logging ─────────────────────────────────────────────────────────
tracing = "0.1" # Structured logging
tracing-subscriber = { version = "0.3", features = [
    "fmt",
    "ansi",
    "env-filter",
] }

# ── Error Handling ──────────────────────────────────────────────────
thiserror = "2.0" # #[derive(Error)] for AppError

# ── Image decoding (tray icon) ─────────────────────────────────
image = { version = "0.25", default-features = false, features = [
    "png",
] }

# ── Utilities ───────────────────────────────────────────────────────
uuid = { version = "1.22", default-features = false, features = [
    "v4",
    "std",
] } # session/run IDs
regex = "1.10" # Shell output sanitization

# ── Dev Dependencies ────────────────────────────────────────────────
[dev-dependencies]
dotenvy = "0.15.7" # .env loading for tests
tempfile = "3"     # Temporary files in tests
