pre-commit:
  parallel: true
  jobs:
    - name: biome
      glob: "*.{js,ts,jsx,tsx,json}"
      run: bunx biome check --write --unsafe {staged_files}
      stage_fixed: true

    - name: markdownlint
      glob: "*.md"
      run: bunx markdownlint-cli2 --fix {staged_files}

    - name: typecheck
      run: bun run check-types

    - name: rust-fmt
      glob: "*.rs"
      run: cargo fmt --check

    - name: rust-clippy
      glob: "*.rs"
      run: cargo clippy -- -D warnings
